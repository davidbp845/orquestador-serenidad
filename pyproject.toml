[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = [
    "frontend",
    "vault_negocio",
    "chroma_data",
    "migrations/versions",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort (orden de imports)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.ruff.lint.per-file-ignores]
# main.py llama a load_dotenv() antes de importar los adaptadores a
# propósito (para que las variables de entorno estén listas antes de
# que se instancien); los tests importan `main`/módulos con
# @patch(...) ya activo para que el parche surta efecto en el import.
# En ambos casos el import fuera de la cabecera es intencional.
"main.py" = ["E402"]
"tests/**/*.py" = ["E402"]
# streamlit_app.py necesita insertar la raíz del repo en sys.path antes
# de importar domain/application/adapters/config (ver comentario en el
# propio fichero) — igual motivo que main.py arriba.
"panel_empleados/streamlit_app.py" = ["E402"]
# evaluar_prompt.py se ejecuta como script suelto fuera de la raíz del
# repo (python scripts/evaluar_prompt.py) e inserta RAIZ_REPO en
# sys.path antes de importar application/ — igual motivo que arriba.
"scripts/evaluar_prompt.py" = ["E402"]
# vaciar_chroma.py: mismo motivo, inserta RAIZ_REPO antes de importar
# adapters/.
"scripts/vaciar_chroma.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = [
    "frontend",
    "vault_negocio",
    "chroma_data",
    "migrations/versions",
]

# domain/ y application/ no dependen de ningún SDK externo, así que
# empiezan con la exigencia más alta; el resto del repo (adapters/,
# main.py, tests/) se tipa de forma incremental más adelante.
[[tool.mypy.overrides]]
module = ["domain.*", "application.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
